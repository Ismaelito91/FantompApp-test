@switch (_settingService.appStatus()) {
   @case ("initialized") {
      @if (!hideHeader) {
         <app-header />
      }
      <router-outlet />
      @if (!hideFooter) {
         <app-footer />
      }
      <app-onboarding *ngIf="_onboardingService.isOnboardingVisible()" />
   } @case ("pending") {
      {{ "APP.LOADING" | translate }}
   } @case ("failed") {
      {{ "APP.ERROR" | translate }}
   } 
}
