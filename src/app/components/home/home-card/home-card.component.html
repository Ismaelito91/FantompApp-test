<div class="home-cards-container">
   <!-- Titre principal -->
   <h5 class="home-cards__main-title">Je protège mes réseaux sociaux</h5>

   <!-- Première carte : Mot de passe -->
   <div
      class="home-card"
      role="button"
      tabindex="0"
      (click)="navigateToTools()"
      (keydown)="onKeyDown($event)"
   >
      <div class="home-card__wrapper">
         <div class="home-card__content">
            <div class="home-card__row">
               <div class="home-card__image-container">
                  <img
                     src="assets/images/password-img.svg"
                     alt="Image de mot de passe"
                     class="home-card__image"
                  />
               </div>
               <div class="home-card__text-content">
                  <h3 class="home-card__subtitle">
                     Je teste mon<br />
                     mot de passe
                  </h3>
                  <p class="home-card__description">
                     En combien de temps un cybercriminel le trouve ?
                  </p>
               </div>
            </div>
         </div>
      </div>
   </div>

   <!-- Deuxième carte : Anonymisation -->
   <div
      class="home-card-anonym"
      role="button"
      tabindex="0"
      (click)="navigateToTools()"
      (keydown)="onKeyDown($event)"
   >
      <div class="home-card-anonym__wrapper">
         <div class="home-card-anonym__content">
            <div class="home-card-anonym__image-container">
               <img
                  src="assets/images/anonym-img.svg"
                  alt="Image d'anonymisation"
                  class="home-card-anonym__image"
               />
            </div>
            <div class="home-card-anonym__text-content">
               <h3 class="home-card-anonym__subtitle">
                  J'anonymise<br />
                  ma photo
               </h3>
               <p class="home-card-anonym__description">
                  Flouter ma photo<br />
                  de profil
               </p>
            </div>
         </div>

         <!-- Fantôme animé -->
         @if (shouldPlayGhostAnimation()) {
         <div class="ghost-animation-container">
            <img
               src="assets/images/Switch-not-wink-light.svg"
               alt=""
               class="ghost-image ghost-normal only-on-light"
               (animationend)="onGhostAnimationEnd()"
            />
            <img
               src="assets/images/Switch-wink-light.svg"
               alt=""
               class="ghost-image ghost-wink-image only-on-light"
            />
            <img
               src="assets/images/Switch-not-wink-dark.svg"
               alt=""
               class="ghost-image ghost-normal only-on-dark"
               (animationend)="onGhostAnimationEnd()"
            />
            <img
               src="assets/images/Switch-wink-dark.svg"
               alt=""
               class="ghost-image ghost-wink-image only-on-dark"
            />
         </div>
         } @else {
            <div class="ghost-animation-container">
               <img
                  src="assets/images/Switch-not-wink-light.svg"
                  alt=""
                  class="ghost-image only-on-light"
               />
               <img
                  src="assets/images/Switch-not-wink-dark.svg"
                  alt=""
                  class="ghost-image only-on-dark"
               />
            </div>
         }
      </div>
   </div>

   <!-- Section des cartes de problèmes - TEMPORAIREMENT COMMENTÉE -->

   <div class="home-cards-problems-container">
      <h5 class="home-cards__section-title">J'ai un problème en ligne</h5>

      <div class="problems-cards-row">
         <div
            class="home-card-problem delete-content-card"
            role="button"
            tabindex="0"
            (click)="navigateToTools()"
            (keydown)="onKeyDown($event)"
         >
            <div class="home-card-problem__main">
               <div class="home-card-problem__background">
                  <div class="home-card-problem__image-container">
                     <img
                        src="assets/images/delete-contenu-card.svg"
                        alt="Image suppression de contenu"
                        class="home-card-problem__image"
                     />
                  </div>
                  <div class="home-card-problem__text-content">
                     <h3 class="home-card-problem__subtitle">
                        Je veux effacer<br />
                        un contenu
                     </h3>
                  </div>
                  <div class="home-card-problem__arrow">
                     <img
                        src="assets/images/chevron16x16-icon.svg"
                        alt="Flèche"
                        class="home-card-problem__arrow-icon"
                     />
                  </div>
               </div>
            </div>
         </div>

         <div
            class="home-card-harassment harassment-card"
            role="button"
            tabindex="0"
            (click)="navigateToHarassment()"
            (keydown)="onKeyDownHarassment($event)"
         >
            <div class="home-card-harassment__main">
               <div class="home-card-harassment__background">
                  <div class="home-card-harassment__image-container">
                     <img
                        src="assets/images/harcelement-card.svg"
                        alt="Image de harcèlement"
                        class="home-card-harassment__image"
                        style="
                           width: 160px !important;
                           height: 144px !important;
                           max-width: 160px !important;
                           max-height: 144px !important;
                        "
                     />
                  </div>
                  <div class="home-card-harassment__text-content">
                     <h6 class="home-card-harassment__subtitle">
                        Je vis du cyber-<br />
                        harcèlement
                     </h6>
                  </div>
               </div>
            </div>
         </div>
      </div>
   </div>
</div>
