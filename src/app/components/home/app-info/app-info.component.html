<div class="app-info-container" role="main">
   <!-- Bouton retour -->
   <div class="back-btn">
      <app-button-back size="md"></app-button-back>
   </div>

   <!-- Contenu global avec padding uniforme -->
   <div class="app-info-content">
      <h1
         class="app-info-title ckeditor-content"
         [innerHTML]="
            (page() | pageTranslation)?.firstTitle! | translate | safeHtml
         "
      ></h1>

      <div class="app-info-text">
         <p
            [innerHTML]="
               (page() | pageTranslation)?.description! | translate | safeHtml
            "
         ></p>
      </div>
   </div>

   <!-- Image principale - sortie du contenu pour prendre toute la largeur -->
   @if ((page() | pageTranslation)?.image) {
   <div class="app-info-image">
      <img
         [src]="(page() | pageTranslation)?.image"
         alt=""
         aria-hidden="true"
         class="image-cover"
      />
   </div>
   }
</div>
