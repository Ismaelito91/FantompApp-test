<div class="flex flex-col card-container">
   @if ((data() | pageTranslation)?.firstTitle) {
   <h2
      [id]="'card-3-title-' + data().id"
      class="card-title ckeditor-content"
      [innerHTML]="
         (data() | pageTranslation)?.firstTitle!
            | translate
            | replaceStringDark
               : 'hsl(258, 88%, 40%)'
               : 'var(--color-primary-400)'
            | safeHtml
      "
   ></h2>
   } @if ((data() | pageTranslation)?.description) {
   <div
      class="card-description ckeditor-content"
      [innerHTML]="
         (data() | pageTranslation)?.description!
            | translate
            | replaceStringDark
               : 'hsl(258, 88%, 40%)'
               : 'var(--color-primary-400)'
            | safeHtml
      "
   ></div>
   } @if (link()) {
   <a
      [routerLink]="link()!"
      class="card-stretched-link"
      [attr.aria-labelledby]="'card-3-title-' + data().id"
   ></a>
   }
</div>
