<button
   mat-fab
   [class]="{
      'btn-lg': size() === 'lg',
      'btn-md': size() === 'md',
      'btn-sm': size() === 'sm'
   }"
   style="border: var(--border) var(--color-13)"
   [attr.aria-label]="'COMMON.CLOSE' | translate"
   [routerLink]="link()"
>
   <mat-icon
      svgIcon="close24x24-icon"
      style="color: var(--color-14)"
   ></mat-icon>
</button>
