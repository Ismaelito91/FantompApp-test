<div class="card-container flex flex-col">
   @if ((data() | pageTranslation)?.firstTitle) {
   <span
      class="card-title ckeditor-content"
      [innerHTML]="
         (data() | pageTranslation)?.firstTitle!
            | translate
            | replaceStringDark
               : 'hsl(258, 88%, 40%)'
               : 'var(--color-primary-400)'
            | safeHtml
      "
   ></span>
   }
   <div class="card-item-container flex flex-col">
      <div>
         <img
            class="card-image"
            [src]="
               (data() | pageTranslation)?.image ||
               (data() | pageTranslation)?.staticImage
            "
            alt=""
         />
      </div>
      <div class="flex justify-between items-center pl-(--spacing-2)">
         <div class="flex flex-col">
            @if ((data() | pageTranslation)?.secondTitle) {
            <h5
               class="ckeditor-content"
               [innerHTML]="
                  (data() | pageTranslation)?.secondTitle!
                     | translate
                     | replaceStringDark
                        : 'hsl(258, 88%, 40%)'
                        : 'var(--color-primary-400)'
                     | safeHtml
               "
            ></h5>
            } @if ((data() | pageTranslation)?.description) {
            <span
               class="card-description ckeditor-content"
               [innerHTML]="
                  (data() | pageTranslation)?.description!
                     | translate
                     | replaceStringDark
                        : 'hsl(258, 88%, 40%)'
                        : 'var(--color-primary-400)'
                     | safeHtml
               "
            ></span>
            }
         </div>
         <div>
            <mat-icon
               [svgIcon]="
                  isDarkMode()
                     ? 'chevron24x24-icon-dark'
                     : 'chevron24x24-icon-light'
               "
            ></mat-icon>
         </div>
      </div>
   </div>
</div>
