<div class="card-container">
   @if ((data() | pageTranslation)?.firstTitle) {
   <h2
      class="card-title ckeditor-content"
      [innerHTML]="
         (data() | pageTranslation)?.firstTitle!
            | translate
            | replaceStringDark
               : 'hsl(258, 88%, 40%)'
               : 'var(--color-primary-400)'
            | safeHtml
      "
   ></h2>
   } @if ((data() | pageTranslation)?.description) {
   <div
      class="card-description ckeditor-content"
      [innerHTML]="
         (data() | pageTranslation)?.description!
            | translate
            | replaceStringDark
               : 'hsl(258, 88%, 40%)'
               : 'var(--color-primary-400)'
            | safeHtml
      "
   ></div>
   } @if (sortedChildren.length > 0) {
   <div class="card-children flex flex-col" role="list">
      @for (child of sortedChildren; track $index) { @switch (child.type) {
      @case (ComponentType.CARD_15) {
      <app-card-15 [data]="child" role="listitem"></app-card-15>
      } } }
   </div>
   }
</div>
