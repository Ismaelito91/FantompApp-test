<div class="flex flex-col h-full card-container">
   <div class="flex items-center justify-center flex-1 overflow-hidden relative">
      @if (index() > 0) {
      <button
         mat-fab
         [attr.aria-label]="
            slideTitle
               ? ('COMMON.CAROUSEL_PREVIOUS'
                    | translate : { slide: slideTitle })
               : ('COMMON.PREVIOUS' | translate)
         "
         class="previous-btn nav-btn"
         (click)="prev.emit()"
      >
         <mat-icon svgIcon="arrow24x24-icon" class="rotate-180"></mat-icon>
      </button>
      }
      <img
         [src]="
            (data() | pageTranslation)?.image ||
            (data() | pageTranslation)?.staticImage
         "
         alt=""
         aria-hidden="true"
         class="card-11-img object-contain rounded-(--border-radius-1)"
      />
      @if (index() < maxIndex()) {
      <button
         mat-fab
         [attr.aria-label]="
            slideTitle
               ? ('COMMON.CAROUSEL_NEXT'
                    | translate : { slide: slideTitle })
               : ('COMMON.NEXT' | translate)
         "
         class="next-btn nav-btn"
         (click)="next.emit()"
      >
         <mat-icon svgIcon="arrow24x24-icon"></mat-icon>
      </button>
      }
   </div>
   <div class="flex flex-col card-11-description" tabindex="-1">
      @if ((data() | pageTranslation)?.firstTitle) {
      <h2 class="step-title ckeditor-content">
         <span>{{ index() + 1 }}.</span>
         <span
            [innerHTML]="
               (data() | pageTranslation)?.firstTitle!
                  | translate
                  | replaceStringDark
                     : 'hsl(258, 88%, 40%)'
                     : 'var(--color-primary-400)'
                  | safeHtml
            "
         ></span>
      </h2>
      }
      @if ((data() | pageTranslation)?.description) {
      <div
         class="ckeditor-content"
         [innerHTML]="
            (data() | pageTranslation)?.description!
               | translate
               | replaceStringDark
                  : 'hsl(258, 88%, 40%)'
                  : 'var(--color-primary-400)'
               | safeHtml
         "
      ></div>
      }
   </div>
</div>
