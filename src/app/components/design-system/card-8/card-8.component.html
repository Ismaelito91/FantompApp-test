<a [routerLink]="data().nextId ? `/secure-myself/${data().nextId}/steps` : null" class="flex flex-col card-container">
   <div class="card-preview">
      @if ((data() | pageTranslation)?.firstTitle){
      <app-tag-unclickable [label]="(data() | pageTranslation)?.firstTitle! | translate"
         class="card-preview-title"></app-tag-unclickable>
      }
      <img class="card-preview-image"
         [src]="(data() | pageTranslation)?.image || (data() | pageTranslation)?.staticImage" alt="screen image" />
   </div>
   <div class="flex items-center card-description">
      @if ((data() | pageTranslation)?.description) {
         <span class="card-description-text ckeditor-content" [innerHTML]="(data() | pageTranslation)?.description! | translate | replaceStringDark:'hsl(258, 88%, 40%)':'var(--color-primary-400)' | safeHtml"></span>
      }
      <div>
         <mat-icon svgIcon="chevron16x16-icon" class="!size-[14px]"></mat-icon>
      </div>
   </div>
</a>
