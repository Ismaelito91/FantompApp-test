<a [routerLink]="data().next ? `/secure-myself/${data().next?.id}/steps` : null" class="flex flex-col card-container">
   <div class="card-preview">
      <span class="card-preview-title" [innerHTML]="(data() | pageTranslation)?.firstTitle | safeHtml"></span>
      <img class="card-preview-image" [src]="(data() | pageTranslation)?.image" alt="screen image" />
   </div>
   <div class="flex items-center card-description">
      <span class="card-description-text" [innerHTML]="(data() | pageTranslation)?.description | safeHtml"></span>
      <mat-icon svgIcon="chevron16x16-icon"></mat-icon>
   </div>
</a>
