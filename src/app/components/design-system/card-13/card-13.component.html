<div class="flex flex-col card-container">
   @if ((data() | pageTranslation)?.firstTitle) {
      <h5 class="card-title" [innerHTML]="(data() | pageTranslation)?.firstTitle! | translate | safeHtml"></h5>
   }
   @if ((data() | pageTranslation)?.description) {
      <div [innerHTML]="(data() | pageTranslation)?.description! | translate | safeHtml"></div>
   }
</div>
