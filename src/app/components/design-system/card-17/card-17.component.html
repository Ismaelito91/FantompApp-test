<div class="card-container flex items-center cursor-pointer">
   <div>
      <img
         [src]="
            (data() | pageTranslation)?.image ||
            (data() | pageTranslation)?.staticImage
         "
         alt=""
         class="!min-w-[56px] !min-h-[56px] !max-w-[56px] !max-h-[56px] object-contain rounded-(--border-radius-1)"
      />
   </div>
   <div class="flex items-center">
      <div class="flex flex-col">
         @if ((data() | pageTranslation)?.firstTitle) {
         <p
            class="card-title ckeditor-content"
            [innerHTML]="
               (data() | pageTranslation)?.firstTitle!
                  | translate
                  | replaceStringDark
                     : 'hsl(258, 88%, 40%)'
                     : 'var(--color-primary-400)'
                  | safeHtml
            "
         ></p>
         } @if((data() | pageTranslation)?.description) {
         <p
            class="card-description ckeditor-content"
            [innerHTML]="
               (data() | pageTranslation)?.description!
                  | translate
                  | replaceStringDark
                     : 'hsl(258, 88%, 40%)'
                     : 'var(--color-primary-400)'
                  | safeHtml
            "
         ></p>
         }
      </div>
      <div>
         <mat-icon
            [svgIcon]="
               isDarkMode()
                  ? 'chevron24x24-icon-dark'
                  : 'chevron24x24-icon-light'
            "
         ></mat-icon>
      </div>
   </div>
</div>
