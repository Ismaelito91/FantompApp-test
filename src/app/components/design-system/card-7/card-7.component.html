<div class="flex flex-col card-container">
   <div class="flex justify-between card-header">
      <div class="flex items-center card-header-title">
         <img [src]="(data() | pageTranslation)?.image || (data() | pageTranslation)?.staticImage" alt="logo" class="!size-[32px] object-contain" />
         <h5 class="ckeditor-content" [innerHTML]="(data() | pageTranslation)?.firstTitle | safeHtml"></h5>
      </div>
      <a class="flex items-center card-header-link" [routerLink]="data().nextId ? `/secure-myself/${data().nextId}` : null">
         <span class="ckeditor-content" [innerHTML]="(data() | pageTranslation)?.secondTitle | safeHtml"></span>
         <mat-icon svgIcon="chevron16x16-icon" class="!size-[16px]"></mat-icon>
      </a>
   </div>
   <div class="flex card-children">
      @for (child of sortedChildren; track $index) {
         @switch (child.type) {
            @case (ComponentType.CARD_8) {
               <app-card-8 [data]="child"></app-card-8>
            }
         }
      }
   </div>
</div>
