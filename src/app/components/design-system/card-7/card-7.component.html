<div class="flex flex-col card-container">
   <div class="flex justify-between card-header">
      <div class="flex items-center card-header-title">
         <img [src]="data().translations.at(0)?.image" alt="logo" />
         <h5 [innerHTML]="data().translations.at(0)?.firstTitle | safeHtml"></h5>
      </div>
      <a class="flex items-center card-header-link" routerLink="/home">
         <span>Tout voir</span>
         <mat-icon svgIcon="chevron16x16-icon"></mat-icon>
      </a>
   </div>
   <div class="flex card-children">
      @for (child of sortedChildren; track $index) {
         @if (child.status === ComponentStatus.PUBLISHED) {
            @switch (child.type) {
               @case (ComponentType.CARD_8) {
                  <app-card-8 [data]="child"></app-card-8>
               }
            }
         }
      }
   </div>
</div>
