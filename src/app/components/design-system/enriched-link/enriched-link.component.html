<a [href]="(data().translations.at(0)?.shortDescription | stripHtml)" target="_blank">
   <div class="flex justify-between tile-main">
      <div class="flex flex-col justify-center tile-container">
         <div class="tile-title" [innerHTML]="data().translations.at(0)?.firstTitle"></div>
         <div class="flex items-center tile-body">
            <img [src]="data().translations.at(0)?.image" class="tile-image" />
            <div class="tile-link" [innerHTML]="data().translations.at(0)?.shortDescription"></div>
         </div>
      </div>
      <div class="flex items-center">
         <mat-icon [svgIcon]="isDarkMode() ? 'icon-external-link-dark' : 'icon-external-link-clear'"></mat-icon>
      </div>
   </div>
</a>
