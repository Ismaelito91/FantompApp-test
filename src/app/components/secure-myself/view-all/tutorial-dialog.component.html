<div
   class="bg-(--background-6) pt-(--spacing-5) pr-(--spacing-3) pb-(--spacing-5) pl-(--spacing-3)"
>
   <mat-dialog-content
      class="!flex flex-col gap-(--spacing-5) !pt-(--spacing-4) !pr-(--spacing-3) !pb-(--spacing-4) !pl-(--spacing-3)"
   >
      <div class="flex flex-col gap-(--spacing-3)">
         <h3
            [innerHTML]="'SECURE_MYSELF.VIEW_ALL.TUTORIAL.TITLE' | translate"
            role="heading"
            aria-level="1"
         ></h3>
         <img src="assets/images/label-illu.svg" alt="" aria-hidden="true" class="w-full" />
         <p
            style="
               color: var(--color-4);
               font-family: var(--body-font-family);
               font-weight: var(--font-weight-body);
               font-size: var(--font-size-body-md);
               line-height: var(--line-height-body);
               letter-spacing: var(--letter-spacing-body);
            "
            [innerHTML]="
               'SECURE_MYSELF.VIEW_ALL.TUTORIAL.DESCRIPTION' | translate
            "
         ></p>
      </div>
      <app-button
         mat-flat-button
         mat-dialog-close
         [label]="'COMMON.UNDERSTOOD' | translate"
         variant="primary"
         class="w-full"
      ></app-button>
   </mat-dialog-content>
</div>
