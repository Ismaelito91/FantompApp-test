<div class="view-all-container">
   <div class="flex justify-between" style="padding: 32px;">
      <app-button-back></app-button-back>
      <img [src]="(page() | pageTranslation)?.image" alt="image" class="!size-[112px] object-contain"/>
   </div>
   <h2 style="margin: 18px 25px;" [innerHTML]="(page() | pageTranslation)?.firstTitle"></h2>
   @for (child of sortedChildren; track $index) {
      <app-card-9 [data]="child"></app-card-9>
   }
</div>
