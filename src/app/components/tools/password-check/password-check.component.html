<div class="password-check-container flex flex-col">
   <div class="password-check-header flex items-center">
      <app-button-back [link]="'/tools'"></app-button-back>
      <img
         src="assets/images/picto-mot-de-passe.svg"
         alt="picto-mot-de-passe"
         class="password-check-item-img"
      />
   </div>
   <div class="password-check-header-content">
      <h3 class="password-check-header-title">Je teste mon mot de passe</h3>
      <p class="password-check-header-description">
         Combien de temps faut-il à un cybercriminel pour le trouver ?
      </p>
   </div>
   <div class="password-check-items flex flex-col">
      <div
         class="password-check-item flex flex-col items-center justify-center"
         style="min-height: 300px"
      >
         <div class="password-check-form flex flex-col">
            <label for="password-input" class="password-check-form-title"
               >Mot de passe</label
            >
            <input
               id="password-input"
               type="password"
               [(ngModel)]="password"
               placeholder="Saisis ton mot de passe"
               autocomplete="off"
            />
            <button
               class="password-check-form-button"
               type="button"
               (click)="testPassword()"
            >
               Test
            </button>
            <p class="password-check-form-result">{{ result }}</p>
            <p class="password-check-form-cracktime">{{ message }}</p>
         </div>
         <ng-content></ng-content>
      </div>
   </div>
</div>
