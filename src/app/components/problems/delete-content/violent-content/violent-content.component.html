<div class="reported-violent-content-container">
   <div class="header flex flex-col relative">
      <app-button-back class="fixed top-[16px] z-1"></app-button-back>
      <div class="flex justify-end">
         <img src="assets/images/warning-picto.png" alt="image" class="!w-[86px] object-contain" />
      </div>
      <div class="details flex flex-col">
         <h3>{{ "PROBLEMS.DELETE_CONTENT.RESULTS.REPORTED_VIOLENT_CONTENT.TITLE" | translate }}</h3>
         <p>{{ "PROBLEMS.DELETE_CONTENT.RESULTS.REPORTED_VIOLENT_CONTENT.DESCRIPTION" | translate }}</p>
      </div>
   </div>
   <div class="flex flex-col gap-(--spacing-4)">
      <app-card-4 [data]="card_4"></app-card-4>
      <app-divider></app-divider>
      <app-card-5 [data]="card_5_1"></app-card-5>
      <app-card-5 [data]="card_5_2"></app-card-5>
   </div>
   <div class="controls fixed bottom-0 left-0 w-full flex">
      <app-button [label]="reported ? 'Adresser une plainte à la CNIL' : 'Signaler le contenu'" variant="primary"
         [iconAfterLabel]="{ name: 'arrow24x24-icon' }" class="w-full" (click)="goTo()"></app-button>
   </div>
</div>
