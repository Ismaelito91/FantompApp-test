<div class="complaint-container">
   <div class="fixed bg-(image:--background-31) h-[110px] w-full z-100"></div>
   <div class="header flex flex-col relative z-101">
      <app-button-back class="fixed top-[16px] z-103"></app-button-back>
      <div class="flex justify-end z-102">
         <img
            src="assets/images/report-picto.png"
            alt="
            "
            class="!w-[86px] object-contain"
         />
      </div>
      <div class="details flex flex-col">
         <h3 role="heading" aria-level="1">
            {{
               "PROBLEMS.DELETE_CONTENT.RESULTS.REPORTED_CONTENT.COMPLAINT.TITLE"
                  | translate
            }}
         </h3>
         <p>
            {{
               "PROBLEMS.DELETE_CONTENT.RESULTS.REPORTED_CONTENT.COMPLAINT.DESCRIPTION"
                  | translate
            }}
         </p>
      </div>
   </div>
   <div class="content flex flex-col gap-(--spacing-6)">
      <div
         class="pt-[50px] pb-[50px] pl-[18px] pr-[18px] rounded-(--border-radius-2) bg-(--background-4)"
      >
         <img
            src="assets/images/screenshot-action.svg"
            alt="
            "
            class="!w-full !h-[235px]"
         />
      </div>
      <div class="flex flex-col gap-(--spacing-3)">
         <h5
            class="!pl-(--spacing-3) !pr-(--spacing-3)"
            [innerHTML]="
               'PROBLEMS.DELETE_CONTENT.RESULTS.REPORTED_CONTENT.COMPLAINT.P1.TITLE'
                  | translate
            "
            role="heading"
            aria-level="2"
         ></h5>
         <p
            class="bg-(--background-4) p-(--spacing-3) rounded-(--border-radius-2)"
            style="font-weight: 500"
            [innerHtml]="
               'PROBLEMS.DELETE_CONTENT.RESULTS.REPORTED_CONTENT.COMPLAINT.P1.DESCRIPTION'
                  | translate
            "
         ></p>
      </div>
      @if (hasComplaintLink) {
      <div class="controls fixed bottom-0 w-full flex">
         <app-button
            [label]="
               'PROBLEMS.DELETE_CONTENT.RESULTS.REPORTED_CONTENT.COMPLAINT.BUTTON'
                  | translate
            "
            variant="primary"
            [iconAfterLabel]="{ name: 'icon-external-link24x24' }"
            class="w-full"
            (click)="
               utilsService.goToExternal(
                  'PROBLEMS.DELETE_CONTENT.RESULTS.REPORTED_CONTENT.COMPLAINT.LINK'
               )
            "
         ></app-button>
      </div>
      }
   </div>
</div>
