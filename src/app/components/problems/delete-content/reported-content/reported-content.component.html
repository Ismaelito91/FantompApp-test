<div class="delete-content-container">
   <div class="header flex flex-col relative">
      <app-button-back link="/tools" class="fixed top-[16px] z-1"></app-button-back>
      <div class="flex justify-end">
         <img src="assets/images/report-picto.png" alt="image" class="!w-[86px] object-contain" />
      </div>
      <div class="details flex flex-col">
         <h3>{{ "PROBLEMS.DELETE_CONTENT.RESULTS.REPORTED_CONTENT.TITLE" | translate }}</h3>
      </div>
      <div class="flex flex-col gap-(--spacing-4)">
         <app-card-5 [data]="t1"></app-card-5>
         <app-divider></app-divider>

         <div>
            <h5>On te conseille d'adresser une plainte à la <a>CNIL</a> si : </h5>
         </div>
      </div>
   </div>
   <div class="controls fixed bottom-0 w-full flex">
      <app-button [label]="'Adresser une plainte'" variant="primary" [iconAfterLabel]="{name: 'arrow24x24-icon' }"
         class="w-full"></app-button>
   </div>
</div>
