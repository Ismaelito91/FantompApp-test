         <img src="assets/images/have-access-picto.png" alt="image" class="!w-[60px] !h-[74px] object-contain" />
      </div>
      <div class="details flex flex-col">
         <h3>{{ "PROBLEMS.HACKING.RESULTS.HAVE_ACCESS.TITLE" | translate }}</h3>
         <p>{{ "PROBLEMS.HACKING.RESULTS.HAVE_ACCESS.DESCRIPTION" | translate }}</p>

   </div>
   <div class="content flex flex-col gap-(--spacing-4)">
      <app-card-16 [data]="card_16_1"></app-card-16>
