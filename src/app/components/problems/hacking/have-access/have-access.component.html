<div class="no-access-container relative">
   <div class="fixed bg-(image:--background-31) h-[110px] w-full z-100"></div>
   <div
      class="absolute bg-gradient-to-b from-[#3339F0] to-[rgba(237,252,254,0)] h-[110px] w-full z-100"
   ></div>
   <div class="header flex flex-col relative z-101">
      <app-button-back class="fixed top-[16px] z-103"></app-button-back>
      <div class="flex justify-end z-102">
         <img
            src="assets/images/have-access-picto.png"
            alt=""
            aria-hidden="true"
            class="!w-[60px] !h-[74px] object-contain"
         />
      </div>
      <div class="details flex flex-col">
         <h3 role="heading" aria-level="1">
            {{ "PROBLEMS.HACKING.RESULTS.HAVE_ACCESS.TITLE" | translate }}
         </h3>
         <p>
            {{ "PROBLEMS.HACKING.RESULTS.HAVE_ACCESS.DESCRIPTION" | translate }}
         </p>
      </div>
   </div>
   <div class="content flex flex-col gap-(--spacing-4)">
      <app-card-16 [data]="card_16_1"></app-card-16>
      <app-divider></app-divider>
      <app-card-16 [data]="card_16_2"></app-card-16>
   </div>
</div>
