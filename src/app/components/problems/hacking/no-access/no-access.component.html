<div class="no-access-container">
   <div class="header flex flex-col relative">
      <app-button-back class="fixed top-[16px] z-2"></app-button-back>
      <div class="flex justify-end">
         <img src="assets/images/no-access-picto.png" alt="image" class="!w-[60px] !h-[74px] object-contain" />
      </div>
      <div class="details flex flex-col">
         <h3>{{ "PROBLEMS.HACKING.RESULTS.NO_ACCESS.TITLE" | translate }}</h3>
      </div>
   </div>
   <div class="content flex flex-col gap-(--spacing-4)">
      <app-card-13 [data]="card_13"></app-card-13>
      <app-card-15 [data]="card_15_1"></app-card-15>
      <app-card-15 [data]="card_15_2"></app-card-15>
      <app-card-15 [data]="card_15_3"></app-card-15>
      <app-card-15 [data]="card_15_4"></app-card-15>
      <app-card-15 [data]="card_15_5"></app-card-15>
   </div>
   <div class="controls fixed max-w-(--max-width-viewport) bottom-0 w-full flex">
      <app-button [label]="'COMMON.NEXT' | translate" variant="primary" [iconAfterLabel]="{ name: 'arrow24x24-icon' }" class="w-full" (click)="utilsService.goTo('hacking/no-access/recommendations')"></app-button>
   </div>
</div>
