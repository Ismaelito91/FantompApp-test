<div
   #splashContainer
   class="splash-screen"
   role="status"
   aria-live="polite"
   aria-label="Écran de démarrage de l'application FantomApp"
>
   <div class="splash-content">
      <img
         src="assets/images/fantome-app.svg"
         alt=""
         class="ghost-logo"
         aria-hidden="false"
      />
   </div>

   <div class="footer" role="contentinfo">
      <img src="assets/images/logo-CNIL-EU.svg" alt="" aria-hidden="true" class="cnil-logo" />
   </div>
   <!-- Message pour lecteurs d'écran indiquant le chargement -->
   <div class="sr-only" aria-live="assertive">
      L'application FantomApp est en cours de chargement, veuillez patienter
      quelques instants
   </div>
</div>
