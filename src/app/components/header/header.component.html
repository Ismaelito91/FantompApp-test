<mat-toolbar class="app-header-toolbar">
   <div class="header-right">
      <button #languageMenuTrigger="matMenuTrigger" class="lang-trigger" mat-button [mat-menu-trigger-for]="languageMenu">
         @if (currentFlagUrl) {
            <img class="flag-img" [src]="currentFlagUrl" alt="flag"/>
         } @else {
            <img class="flag-img" src="assets/flags/xx.png" alt="flag"/>
         }
         @if (!languageMenuTrigger.menuOpen) {
            <mat-icon class="chevron" iconPositionEnd>expand_more</mat-icon>
         } @else {
            <mat-icon class="chevron" iconPositionEnd>expand_less</mat-icon>
         }
      </button>
   </div>

   <mat-menu #languageMenu="matMenu" class="lang-menu" style="width: auto;">
      <div class="lang-menu-panel">
         @for (lang of _languageService.supportedLanguages; track lang.code) {
            <button mat-menu-item class="lang-item" (click)="_languageService.setLanguage(lang.code)">
               <div class="lang-item">
                  @if (lang.flagUrl) {
                     <img class="flag-img" [src]="lang.flagUrl" alt="flag"/>
                  }
                  <span class="language">{{ lang.languageName }}</span>
                  <span class="country">&nbsp;⸱&nbsp;{{ lang.countryName }}</span>
                  <span class="radio" [class.selected]="_languageService.language() === lang.code"></span>
               </div>
               <mat-divider class="divider"></mat-divider>
            </button>
         }
      </div>
   </mat-menu>
   @if(isVisible()){
   <div class="header-right">
      <button #deviceMenuTrigger="matMenuTrigger" class="lang-trigger" mat-button [mat-menu-trigger-for]="deviceMenu">
         <mat-icon>📱</mat-icon>
         @if (!deviceMenuTrigger.menuOpen) {
            <mat-icon class="chevron" iconPositionEnd>expand_more</mat-icon>
         } @else {
            <mat-icon class="chevron" iconPositionEnd>expand_less</mat-icon>
         }
      </button>
   </div>

   
      <mat-menu #deviceMenu="matMenu" class="lang-menu" style="width: auto;">
         <div class="lang-menu-panel">
            <button mat-menu-item class="lang-item" (click)="setDevice(Device.IOS)">
               <div class="lang-item">
                  <span class="language">IOS</span>
                  <span class="radio" [class.selected]="selectedDevice === Device.IOS"></span>
               </div>
               <mat-divider class="divider"></mat-divider>
            </button>
            <button mat-menu-item class="lang-item" (click)="setDevice(Device.ANDROID)">
               <div class="lang-item">
                  <span class="language">Android</span>
                  <span class="radio" [class.selected]="selectedDevice === Device.ANDROID"></span>
               </div>
               <mat-divider class="divider"></mat-divider>
            </button>
            <button mat-menu-item class="lang-item" (click)="setDevice(Device.WEB)">
               <div class="lang-item web">
                  <span class="language">Web</span>
                  <span class="radio" [class.selected]="selectedDevice === Device.WEB"></span>
               </div>
               <mat-divider class="divider"></mat-divider>
            </button>
         </div>
      </mat-menu>
   }
</mat-toolbar>
