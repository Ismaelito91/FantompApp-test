<mat-toolbar class="app-header-toolbar">
   @if(isVisible()) {
   <div class="header-right">
      <button
         class="lang-trigger"
         mat-button
         (click)="toggleDeviceMenu()"
         [attr.aria-disabled]="null"
         [attr.role]="null"
         [attr.aria-label]="
            'ALT_TEXT.HEADER.CURRENT_DEVICE'
               | translate : { device: selectedDevice }
         "
         [attr.aria-expanded]="deviceMenuOpen"
      >
         <span class="device-emoji-icon" aria-hidden="true">📱</span>
         @if (!deviceMenuOpen) {
         <mat-icon class="chevron" iconPositionEnd>expand_more</mat-icon>
         } @else {
         <mat-icon class="chevron" iconPositionEnd>expand_less</mat-icon>
         }
      </button>

      @if (deviceMenuOpen) {
      <div class="menu-overlay" (click)="closeAllMenus()"></div>
      <div
         class="custom-menu-container custom-menu-container--device"
         [class.is-fixed]="deviceMenuFixed"
      >
         <div class="mat-mdc-menu-panel mat-menu-panel lang-menu">
            <div class="mat-mdc-menu-content">
               <ul class="menu-list" role="list">
                  <li role="listitem">
                     <button
                        class="mat-mdc-menu-item lang-item"
                        (click)="setDevice(Device.IOS)"
                        [attr.aria-pressed]="
                           selectedDevice === Device.IOS ? 'true' : 'false'
                        "
                     >
                        <div class="lang-item">
                           <span class="language">IOS</span>
                           <span
                              class="radio"
                              [class.selected]="selectedDevice === Device.IOS"
                           ></span>
                        </div>
                     </button>
                     <mat-divider class="divider"></mat-divider>
                  </li>
                  <li role="listitem">
                     <button
                        class="mat-mdc-menu-item lang-item"
                        (click)="setDevice(Device.ANDROID)"
                        [attr.aria-pressed]="
                           selectedDevice === Device.ANDROID ? 'true' : 'false'
                        "
                     >
                        <div class="lang-item">
                           <span class="language">Android</span>
                           <span
                              class="radio"
                              [class.selected]="
                                 selectedDevice === Device.ANDROID
                              "
                           ></span>
                        </div>
                     </button>
                     <mat-divider class="divider"></mat-divider>
                  </li>
                  <li role="listitem">
                     <button
                        class="mat-mdc-menu-item lang-item"
                        (click)="setDevice(Device.WEB)"
                        [attr.aria-pressed]="
                           selectedDevice === Device.WEB ? 'true' : 'false'
                        "
                     >
                        <div class="lang-item web">
                           <span class="language">Web</span>
                           <span
                              class="radio"
                              [class.selected]="selectedDevice === Device.WEB"
                           ></span>
                        </div>
                     </button>
                     <mat-divider class="divider"></mat-divider>
                  </li>
               </ul>
            </div>
         </div>
      </div>
      }
   </div>
   }

   <div class="header-right">
      <button
         class="lang-trigger"
         mat-button
         (click)="toggleLanguageMenu()"
         [attr.aria-disabled]="null"
         [attr.role]="null"
         [attr.lang]="currentLanguageLang"
         [attr.aria-label]="
            'ALT_TEXT.HEADER.CURRENT_LANGUAGE'
               | translate : { language: currentLanguageName }
         "
         [attr.aria-expanded]="languageMenuOpen"
      >
         @if (currentFlagUrl) {
         <img
            class="flag-img !size-[16px] !m-0"
            [src]="currentFlagUrl"
            [alt]="currentFlagAltKey | translate"
         />
         } @else {
         <span
            class="emoji-icon !m-0"
            role="img"
            aria-hidden="false"
            [attr.aria-label]="currentFlagAltKey | translate"
            >🌐</span
         >
         } @if (!languageMenuOpen) {
         <mat-icon class="chevron" iconPositionEnd>expand_more</mat-icon>
         } @else {
         <mat-icon class="chevron" iconPositionEnd>expand_less</mat-icon>
         }
      </button>

      @if (languageMenuOpen) {
      <div class="menu-overlay" (click)="closeAllMenus()"></div>
      <div
         class="custom-menu-container custom-menu-container--language"
         [class.is-fixed]="languageMenuFixed"
      >
         <div class="mat-mdc-menu-panel mat-menu-panel lang-menu">
            <div class="mat-mdc-menu-content">
               <ul class="menu-list" role="list">
                  @for (lang of _languageService.supportedLanguages; track
                  lang.code) {
                  <li role="listitem">
                     <button
                        class="mat-mdc-menu-item lang-item"
                        (click)="
                           _languageService.setLanguage(lang.code);
                           closeAllMenus()
                        "
                        [attr.aria-pressed]="
                           _languageService.language() === lang.code
                              ? 'true'
                              : 'false'
                        "
                     >
                        <div class="lang-item" [attr.lang]="lang.lang">
                           @if (lang.flagUrl) {
                           <img class="flag-img" [src]="lang.flagUrl" alt="" aria-hidden="true" />
                           } @else {
                           <span class="emoji-icon" aria-hidden="true">🌐</span>
                           }
                           <span class="language">{{ lang.languageName }}</span>
                           <span class="country"
                              >&nbsp;⸱&nbsp;{{ lang.countryName }}</span
                           >
                           <span
                              class="radio"
                              [class.selected]="
                                 _languageService.language() === lang.code
                              "
                           ></span>
                        </div>
                     </button>
                     <mat-divider class="divider"></mat-divider>
                  </li>
                  }
               </ul>
            </div>
         </div>
      </div>
      }
   </div>
</mat-toolbar>
