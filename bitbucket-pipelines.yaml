image: atlassian/default-image:latest

pipelines:
  default:
    - step:
        name: 🚀 Build & Push Docker Image (Commit)
        services:
          - docker
        caches:
          - docker
        script:
          - export SHORT_SHA=$(echo $BITBUCKET_COMMIT | cut -c1-7)
          - docker build -t rg.fr-par.scw.cloud/demo-aot/fantome-app-frontend:latest -t rg.fr-par.scw.cloud/demo-aot/fantome-app-frontend:$SHORT_SHA .
          - docker login -u "$DOCKER_USER" -p "$DOCKER_PASS" rg.fr-par.scw.cloud
          - docker push rg.fr-par.scw.cloud/demo-aot/fantome-app-frontend:latest
          - docker push rg.fr-par.scw.cloud/demo-aot/fantome-app-frontend:$SHORT_SHA

  tags:
    '**':
      - step:
          name: 🚀 Build & Push Docker Image (Git Tag)
          services:
            - docker
          caches:
            - docker
          script:
            - docker build -t rg.fr-par.scw.cloud/demo-aot/fantome-app-frontend:$BITBUCKET_TAG .
            - docker login -u "$DOCKER_USER" -p "$DOCKER_PASS" rg.fr-par.scw.cloud
            - docker push rg.fr-par.scw.cloud/demo-aot/fantome-app-frontend:$BITBUCKET_TAG
